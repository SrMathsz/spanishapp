<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="theme-color" content="#d9d9d9"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Espanhol App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: coluna única de celular (largura máx. 480px), conteúdo rolável e barra de abas fixa embaixo, como nos protótipos. */
:root {
  --bg: #d9d9d9;
  --surface: #ffffff;
  --fg: #1c1c1e;
  --muted: #5b5b60;
  --accent: #e8a33d;
  --accent-ink: #3a2500;
  --ok: #17692f;
  --bad: #a3231d;
  --line: #c4c4c8;
  --font: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1c1f; --surface: #2b2d32; --fg: #f1f1f3; --muted: #a3a3aa;
    --accent: #f0b254; --accent-ink: #2a1a00; --ok: #6fd18a; --bad: #ff8c84; --line: #3b3d43;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1c1f; --surface: #2b2d32; --fg: #f1f1f3; --muted: #a3a3aa;
  --accent: #f0b254; --accent-ink: #2a1a00; --ok: #6fd18a; --bad: #ff8c84; --line: #3b3d43;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
.app { max-width: 480px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
main { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 1.15rem; margin: 0; text-wrap: balance; }
.top { display: flex; align-items: center; gap: 10px; }
.top button.back { width: 40px; height: 40px; padding: 0; border-radius: 50%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  width: 100%; min-height: 50px; border: 0; background: var(--surface); color: var(--fg);
  border-radius: 4px; font-weight: 500; padding: 0 16px;
}
.btn.round { border-radius: 26px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn:disabled { opacity: .55; cursor: default; }
.field {
  width: 100%; min-height: 50px; border: 0; background: var(--surface); color: var(--fg);
  border-radius: 4px; padding: 0 16px; text-align: center;
}
.field.round { border-radius: 26px; text-align: left; }
.field::placeholder { color: var(--muted); }
.swap { align-self: center; background: none; border: 0; font-size: 1.6rem; line-height: 1; padding: 6px 14px; }
.grow { flex: 1; }
.center { display: flex; flex-direction: column; gap: 12px; justify-content: center; flex: 1; }
.msg { min-height: 1.4em; text-align: center; font-weight: 500; }
.msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
.hint { color: var(--muted); font-size: .85rem; text-align: center; margin: 0; }
.prompt { font-size: 2rem; font-weight: 700; text-align: center; margin: 0; overflow-wrap: anywhere; }
.count { text-align: center; color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.letter { font-weight: 700; margin: 14px 0 4px; }
.row { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.row span.w { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row .hits { color: var(--ok); font-size: .8rem; font-variant-numeric: tabular-nums; }
.row .del { background: none; border: 0; color: var(--muted); padding: 6px 10px; border-radius: 6px; }
.row .del.armed { background: var(--bad); color: #fff; }
.empty { color: var(--muted); text-align: center; padding: 28px 8px; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: #bfe3f5; display: grid; place-items: center; color: #1c3a4a; font-size: 2rem; }
nav { display: flex; padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
nav button { flex: 1; background: none; border: 0; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .75rem; color: var(--muted); }
nav button svg { width: 26px; height: 26px; fill: currentColor; }
nav button[aria-current="page"] { color: var(--fg); font-weight: 700; }
nav button[aria-current="page"] .pill { background: var(--accent); color: var(--accent-ink); }
nav .pill { padding: 3px 18px; border-radius: 14px; display: grid; place-items: center; }
@media (prefers-reduced-motion: no-preference) { .btn, nav .pill { transition: background .15s; } }
</style>

<div class="app">
  <main id="main"></main>
  <nav aria-label="Navegação principal">
    <button data-tab="home"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg></span>Início</button>
    <button data-tab="words"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm2 4v2h12V8zm0 4v2h12v-2zm0 4v2h8v-2z"/></svg></span>Palavras</button>
    <button data-tab="profile"><span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5z"/></svg></span>Perfil</button>
  </nav>
</div>

<script src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</html>
